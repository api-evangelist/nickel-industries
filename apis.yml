aid: nickel-industries

name: Nickel Industries

description: Nickel Industries Limited is an ASX-listed company (ASX:NIC) that owns a portfolio of nickel mining and low-cost
  downstream nickel processing assets in Indonesia, including RKEF and HPAL operations developed in collaboration with the
  Tsingshan group at the Indonesia Morowali and Weda Bay industrial parks. It produces nickel pig iron for the stainless steel
  industry and is transitioning production toward battery-grade nickel for the electric vehicle supply chain. Surfaced via
  the API Evangelist harvest backlog (australia-apidays-2026); its website publishes no developer portal or public API.

